name: Build & Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Import database
        run: mysql -h 127.0.0.1 -uroot -proot < schema.sql

      - name: Smoke test app
        env:
          DB_HOST: 127.0.0.1
          DB_USER: root
          DB_PASS: root
        run: |
          python main.py &
          sleep 4
          curl -sf http://localhost:5000/        | grep -q MovieLab
          echo "Congrats! executed Successfully :)"
