<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MovieLab</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdn.jsdelivr.net/npm/daisyui@4/dist/full.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <style> html { font-size: 18px; } </style>
</head>
<body class="font-[Inter] bg-base-200 min-h-screen">
  <nav class="navbar bg-base-100 shadow-sm max-w-5xl mx-auto">
    <a href="/" class="btn btn-ghost text-xl font-bold">🎬 MovieLab</a>
    <div class="ml-auto flex gap-2">
      <a class="btn btn-sm" href="/top">Top Rated</a>
      <a class="btn btn-sm btn-accent" href="/add">+ Add Movie</a>
    </div>
  </nav>
  <main class="max-w-5xl mx-auto p-4">{% block content %}{% endblock %}</main>
</body>
</html>
