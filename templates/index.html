{% extends "base.html" %}
{% block content %}
<form class="join my-4">
  <input name="q" value="{{ q }}" class="input input-bordered join-item w-full"
         placeholder="Search title, genre, director…">
  <button class="btn btn-accent join-item">Search</button>
</form>

<div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
  {% for m in movies %}
  <div class="card bg-base-100 shadow-md rounded-2xl">
    <div class="card-body">
      <h2 class="card-title">{{ m.title }} <span class="badge badge-outline">{{ m.releaseYear }}</span></h2>
      <div class="flex gap-2">
        <span class="badge badge-accent">{{ m.genre }}</span>
        <span class="badge badge-ghost">★ {{ m.avg_rating or '–' }}</span>
      </div>
      <a href="/movie/{{ m.movieID }}" class="btn btn-sm btn-outline mt-2">Details</a>
    </div>
  </div>
  {% else %}<p class="opacity-60">No movies found.</p>{% endfor %}
</div>
{% endblock %}
